<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>LinkedIn career</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: lock screen, then three tabs (Posts, Proof guides, Study). Posts are copy-ready cards with a posted mark; guides and study open as long reads. Same brand colors as Backstage, dark first. */
  :root {
    --bg: #0c0c0e; --surface: #141417; --raise: #1b1b1f; --line: #2a2a30; --ink: #ece7dc; --muted: #a39d90;
    --gold: #c99a4a; --gold-ink: #0c0c0e; --warn: #e0937f; --ok: #7fb58a;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f3ec; --surface: #ffffff; --raise: #efebe0; --line: #ddd7c9; --ink: #1d1b17; --muted: #6a6558;
      --gold: #8a6420; --gold-ink: #ffffff; --warn: #a63d2a; --ok: #2f6b3d; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f6f3ec; --surface: #ffffff; --raise: #efebe0; --line: #ddd7c9; --ink: #1d1b17; --muted: #6a6558;
    --gold: #8a6420; --gold-ink: #ffffff; --warn: #a63d2a; --ok: #2f6b3d; color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 72px; }
  main { max-width: 860px; margin-inline: auto; }
  h1, h2, h3, p { margin: 0; }
  button, input { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .eyebrow { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  h1 { font-family: var(--display); font-weight: 600; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.05; margin-top: 6px; text-wrap: balance; }
  .lede { color: var(--muted); margin-top: 8px; max-width: 58ch; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .top-row .grp { display: flex; gap: 8px; }
  .btn { font-weight: 600; font-size: 0.9rem; border-radius: 8px; padding: 9px 16px; min-height: 42px; border: 1px solid var(--line); background: transparent; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; color: var(--ink); }
  .btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
  .btn.small { min-height: 36px; padding: 6px 12px; font-size: 0.85rem; }
  .btn.ghost:hover { border-color: var(--gold); color: var(--gold); }
  .btn[aria-pressed="true"] { border-color: var(--ok); color: var(--ok); }
  .field { display: block; width: 100%; font-size: 1rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; min-height: 48px; }
  .lock { max-width: 420px; margin: 10vh auto 0; display: grid; gap: 10px; }
  .lock form { display: grid; gap: 12px; margin-top: 8px; }
  .lockmsg { color: var(--warn); font-size: 0.9rem; min-height: 1.3em; }
  .tabs { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 16px; min-height: 40px; cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--muted); }
  .tab[aria-selected="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
  .filters { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .filters .tab { min-height: 34px; padding: 4px 12px; font-size: 0.8rem; }
  .list { display: grid; gap: 12px; margin-top: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
  .card h2 { font-family: var(--display); font-weight: 600; font-size: 1.2rem; line-height: 1.25; margin-top: 8px; }
  .chip { display: inline-block; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; border-radius: 999px; padding: 2px 8px; border: 1px solid var(--line); color: var(--muted); }
  .chip.done { border-color: var(--ok); color: var(--ok); }
  .text { margin-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .code { position: relative; margin-top: 12px; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 12px 12px 12px 12px; }
  .code pre { margin: 0; font-family: var(--mono); font-size: 0.85rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .code .btn { margin-top: 10px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  details.card > summary { cursor: pointer; list-style: none; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary h2 { display: inline; }
  details.card[open] > summary { margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .parts { display: grid; gap: 10px; margin-top: 12px; }
  .parts .card { background: var(--raise); }
  .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 18px; }
  @media (prefers-reduced-motion: no-preference) { .btn, .tab { transition: background 0.15s, border-color 0.15s, color 0.15s; } }
</style>
</head>
<body>
<main>
  <section id="lock" class="lock" hidden>
    <p class="eyebrow">GovernorHQ</p>
    <h1>LinkedIn career</h1>
    <p class="lede">Team only. Enter your passcode to continue.</p>
    <form id="lockform">
      <label class="sr" for="pc">Passcode</label>
      <input class="field" id="pc" name="password" type="password" autocomplete="current-password" placeholder="Passcode" required>
      <button class="btn primary" id="lockbtn" type="submit">Open</button>
      <p class="lockmsg" id="lockmsg" role="alert"></p>
    </form>
  </section>
  <div id="app" hidden>
    <div class="top-row">
      <a class="btn small ghost" href="/backstage">Backstage</a>
      <button class="btn small ghost" id="logout" type="button">Sign out</button>
    </div>
    <p class="eyebrow" style="margin-top:18px">GovernorHQ</p>
    <h1>LinkedIn career</h1>
    <p class="lede">Cybersecurity and software security posts, the proof guide for each one, and the study behind them.</p>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="filters" id="filters" hidden></div>
    <div class="list" id="list"></div>
  </div>
</main>
<script>
function $(s) { return document.querySelector(s); }
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
var TABS = [
  { id: "posts", label: "Posts" },
  { id: "guides", label: "Proof guides" },
  { id: "study", label: "Study" }
];
var items = [], marks = {}, tab = "posts", filter = "todo";

function call(url, method, body) {
  var opt = { method: method, credentials: "same-origin", headers: {} };
  if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  return fetch(url, opt).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, json: j }; });
  });
}
function showLock(msg) {
  $("#app").hidden = true;
  $("#lock").hidden = false;
  $("#lockmsg").textContent = msg || "";
}
function copyText(text, btn) {
  var done = function () {
    var old = btn.getAttribute("data-label") || btn.textContent;
    btn.setAttribute("data-label", old);
    btn.textContent = "Copied";
    setTimeout(function () { btn.textContent = old; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}
function fallbackCopy(text) {
  var t = document.createElement("textarea");
  t.value = text;
  t.setAttribute("readonly", "");
  t.style.position = "fixed";
  t.style.opacity = "0";
  document.body.appendChild(t);
  t.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(t);
}
// Body text with triple-backtick blocks shown as code, each with its own Copy button.
function renderBody(text, box) {
  var parts = String(text || "").split("```");
  parts.forEach(function (seg, i) {
    if (i % 2 === 0) {
      var t = seg.replace(/^\n+|\n+$/g, "");
      if (t) box.appendChild(el("div", "text", t));
    } else {
      var code = seg.replace(/^[^\n]*\n/, "").replace(/\n+$/, "");
      var wrap = el("div", "code");
      wrap.appendChild(el("pre", null, code));
      var b = el("button", "btn small ghost", "Copy");
      b.type = "button";
      b.addEventListener("click", function () { copyText(code, b); });
      wrap.appendChild(b);
      box.appendChild(wrap);
    }
  });
}
function isPosted(it) { return !!marks[it.id]; }
function setMark(it, on, btn, chip) {
  var before = marks[it.id];
  if (on) marks[it.id] = new Date().toISOString(); else delete marks[it.id];
  btn.setAttribute("aria-pressed", on ? "true" : "false");
  btn.textContent = on ? "Posted" : "Mark as posted";
  chip.textContent = on ? "Posted" : "To post";
  chip.className = on ? "chip done" : "chip";
  call("/api/career", "POST", { action: "mark", key: it.id, on: on }).then(function (r) {
    if (!r.ok) {
      if (before) marks[it.id] = before; else delete marks[it.id];
      render();
    }
  }, function () {
    if (before) marks[it.id] = before; else delete marks[it.id];
    render();
  });
}
function postCard(it) {
  var card = el("article", "card");
  var head = el("div", "top-row");
  head.appendChild(el("span", "chip", it.tag));
  var posted = isPosted(it);
  var status = el("span", posted ? "chip done" : "chip", posted ? "Posted" : "To post");
  head.appendChild(status);
  card.appendChild(head);
  card.appendChild(el("h2", null, it.title));
  card.appendChild(el("div", "text", it.body));
  var acts = el("div", "actions");
  var copy = el("button", "btn small primary", "Copy post");
  copy.type = "button";
  copy.addEventListener("click", function () { copyText(it.body, copy); });
  var mark = el("button", "btn small ghost", posted ? "Posted" : "Mark as posted");
  mark.type = "button";
  mark.setAttribute("aria-pressed", posted ? "true" : "false");
  mark.addEventListener("click", function () { setMark(it, !isPosted(it), mark, status); });
  acts.appendChild(copy);
  acts.appendChild(mark);
  card.appendChild(acts);
  return card;
}
function readCard(it) {
  var d = el("details", "card");
  var sum = el("summary");
  sum.appendChild(el("span", "chip", it.tag));
  sum.appendChild(document.createElement("br"));
  sum.appendChild(el("h2", null, it.title));
  d.appendChild(sum);
  var box = el("div");
  renderBody(it.body, box);
  d.appendChild(box);
  return d;
}
// One card for a whole topic; its parts open inside it.
function groupCard(topic, parts) {
  var d = el("details", "card");
  var sum = el("summary");
  sum.appendChild(el("span", "chip", parts[0].tag));
  sum.appendChild(document.createElement("br"));
  sum.appendChild(el("h2", null, topic));
  sum.appendChild(el("p", "meta", parts.length + (parts.length === 1 ? " part" : " parts")));
  d.appendChild(sum);
  var inner = el("div", "parts");
  parts.forEach(function (p) { inner.appendChild(readCard(p)); });
  d.appendChild(inner);
  return d;
}
function renderTabs() {
  var box = $("#tabs");
  box.textContent = "";
  TABS.forEach(function (t) {
    var b = el("button", "tab", t.label);
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", t.id === tab ? "true" : "false");
    b.addEventListener("click", function () { tab = t.id; render(); });
    box.appendChild(b);
  });
}
function renderFilters() {
  var box = $("#filters");
  box.textContent = "";
  if (tab !== "posts") { box.hidden = true; return; }
  box.hidden = false;
  [["todo", "To post"], ["done", "Posted"], ["all", "All"]].forEach(function (f) {
    var b = el("button", "tab", f[1]);
    b.type = "button";
    b.setAttribute("aria-selected", f[0] === filter ? "true" : "false");
    b.addEventListener("click", function () { filter = f[0]; render(); });
    box.appendChild(b);
  });
}
function render() {
  renderTabs();
  renderFilters();
  var list = $("#list");
  list.textContent = "";
  var rows = items.filter(function (it) { return it.section === tab; });
  if (tab === "posts") {
    rows = rows.filter(function (it) {
      return filter === "all" || (filter === "done" ? isPosted(it) : !isPosted(it));
    });
  }
  if (!rows.length) {
    list.appendChild(el("p", "empty", tab === "posts" && filter === "todo" ? "Nothing left to post here." : "Nothing here yet."));
    return;
  }
  if (tab === "posts") {
    rows.forEach(function (it) { list.appendChild(postCard(it)); });
    return;
  }
  // Items that share a topic are grouped under one card, in order of first appearance.
  var out = [], groups = {};
  rows.forEach(function (it) {
    if (!it.topic) { out.push({ one: it }); return; }
    if (!groups[it.topic]) { groups[it.topic] = { topic: it.topic, parts: [] }; out.push({ group: groups[it.topic] }); }
    groups[it.topic].parts.push(it);
  });
  out.forEach(function (o) { list.appendChild(o.group ? groupCard(o.group.topic, o.group.parts) : readCard(o.one)); });
}
function load() {
  return call("/api/career", "GET").then(function (r) {
    if (r.status === 401) { showLock(); return; }
    if (r.status === 403) { showLock("This account does not have access to this tool."); return; }
    if (r.status === 503) { showLock("Backstage is not set up yet. Add BANK_PASSCODE in Vercel."); return; }
    if (!r.ok) { showLock("Could not load. Check your connection and try again."); return; }
    items = r.json.items || [];
    marks = r.json.marks || {};
    $("#lock").hidden = true;
    $("#app").hidden = false;
    render();
  }, function () { showLock("No connection. Try again."); });
}
$("#lockform").addEventListener("submit", function (e) {
  e.preventDefault();
  var pc = $("#pc").value;
  if (!pc) return;
  var btn = $("#lockbtn");
  btn.disabled = true;
  call("/api/auth", "POST", { action: "login", passcode: pc }).then(function (r) {
    btn.disabled = false;
    if (r.ok) { $("#pc").value = ""; $("#lockmsg").textContent = ""; load(); }
    else if (r.status === 429) showLock("Too many wrong tries. Try again in an hour.");
    else if (r.status === 401) showLock("That is not the passcode." + (typeof r.json.left === "number" ? " " + r.json.left + " tries left." : ""));
    else if (r.status === 503) showLock("Backstage is not set up yet. Add BANK_PASSCODE in Vercel.");
    else showLock("Something went wrong. Try again.");
  }, function () { btn.disabled = false; showLock("No connection. Try again."); });
});
$("#logout").addEventListener("click", function () {
  call("/api/auth", "POST", { action: "logout" }).then(function () { items = []; marks = {}; showLock(); });
});
load();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Knowledge bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: lock screen, then a search box and five tabs (Notes, Themes, Mentors, Outlines, Rules). Everything opens as a long read. Same brand colors as Backstage, dark first. */
  :root {
    --bg: #0c0c0e; --surface: #141417; --raise: #1b1b1f; --line: #2a2a30; --ink: #ece7dc; --muted: #a39d90;
    --gold: #c99a4a; --gold-ink: #0c0c0e; --warn: #e0937f; --ok: #7fb58a;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f3ec; --surface: #ffffff; --raise: #efebe0; --line: #ddd7c9; --ink: #1d1b17; --muted: #6a6558;
      --gold: #8a6420; --gold-ink: #ffffff; --warn: #a63d2a; --ok: #2f6b3d; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f6f3ec; --surface: #ffffff; --raise: #efebe0; --line: #ddd7c9; --ink: #1d1b17; --muted: #6a6558;
    --gold: #8a6420; --gold-ink: #ffffff; --warn: #a63d2a; --ok: #2f6b3d; color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 72px; }
  main { max-width: 860px; margin-inline: auto; }
  h1, h2, h3, p { margin: 0; }
  button, input { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .eyebrow { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  h1 { font-family: var(--display); font-weight: 600; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.05; margin-top: 6px; text-wrap: balance; }
  .lede { color: var(--muted); margin-top: 8px; max-width: 60ch; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .btn { font-weight: 600; font-size: 0.9rem; border-radius: 8px; padding: 9px 16px; min-height: 42px; border: 1px solid var(--line); background: transparent; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; color: var(--ink); }
  .btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
  .btn.small { min-height: 36px; padding: 6px 12px; font-size: 0.85rem; }
  .btn.ghost:hover { border-color: var(--gold); color: var(--gold); }
  .field { display: block; width: 100%; font-size: 1rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; min-height: 48px; }
  .lock { max-width: 420px; margin: 10vh auto 0; display: grid; gap: 10px; }
  .lock form { display: grid; gap: 12px; margin-top: 8px; }
  .lockmsg { color: var(--warn); font-size: 0.9rem; min-height: 1.3em; }
  .search { margin-top: 22px; }
  .tabs { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 16px; min-height: 40px; cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--muted); }
  .tab[aria-selected="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
  .tabs.dim .tab[aria-selected="true"] { background: transparent; border-color: var(--line); color: var(--muted); }
  .note { color: var(--muted); font-size: 0.85rem; margin-top: 12px; }
  .list { display: grid; gap: 12px; margin-top: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
  .card h2 { font-family: var(--display); font-weight: 600; font-size: 1.2rem; line-height: 1.25; margin-top: 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-block; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; border-radius: 999px; padding: 2px 8px; border: 1px solid var(--line); color: var(--muted); }
  .chip.done { border-color: var(--ok); color: var(--ok); }
  .text { margin-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .srcline { margin-top: 12px; font-size: 0.85rem; }
  .srcline a { color: var(--gold); }
  .code { margin-top: 12px; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .code pre { margin: 0; font-family: var(--mono); font-size: 0.85rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .code .btn { margin-top: 10px; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .parts { display: grid; gap: 10px; margin-top: 12px; }
  .parts .card { background: var(--raise); }
  details.card > summary { cursor: pointer; list-style: none; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary h2 { display: inline; }
  details.card[open] > summary { margin-bottom: 4px; }
  .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 18px; }
  @media (prefers-reduced-motion: no-preference) { .btn, .tab { transition: background 0.15s, border-color 0.15s, color 0.15s; } }
</style>
</head>
<body>
<main>
  <section id="lock" class="lock" hidden>
    <p class="eyebrow">GovernorHQ</p>
    <h1>Knowledge bank</h1>
    <p class="lede">Team only. Enter your passcode to continue.</p>
    <form id="lockform">
      <label class="sr" for="pc">Passcode</label>
      <input class="field" id="pc" name="password" type="password" autocomplete="current-password" placeholder="Passcode" required>
      <button class="btn primary" id="lockbtn" type="submit">Open</button>
      <p class="lockmsg" id="lockmsg" role="alert"></p>
    </form>
  </section>
  <div id="app" hidden>
    <div class="top-row">
      <a class="btn small ghost" href="/backstage">Backstage</a>
      <button class="btn small ghost" id="logout" type="button">Sign out</button>
    </div>
    <p class="eyebrow" style="margin-top:18px">GovernorHQ</p>
    <h1>Knowledge bank</h1>
    <p class="lede">Notes, themes and outlines in your own words, for posts, books, classes and seminars. No raw transcripts live here.</p>
    <div class="search">
      <label class="sr" for="q">Search the bank</label>
      <input class="field" id="q" type="search" placeholder="Search notes, themes, mentors, rules" autocomplete="off">
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <p class="note" id="searchnote" hidden></p>
    <div class="list" id="list"></div>
  </div>
</main>
<script>
function $(s) { return document.querySelector(s); }
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
var TABS = [
  { id: "notes", label: "Notes", one: "Note" },
  { id: "themes", label: "Themes", one: "Theme" },
  { id: "mentors", label: "Mentors", one: "Mentor" },
  { id: "outlines", label: "Outlines", one: "Outline" },
  { id: "rules", label: "Rules", one: "Rule" }
];
var EMPTY = {
  outlines: "No outlines yet. Book, class and seminar outlines go here, each pointing at the themes that feed it."
};
var items = [], tab = "notes", query = "";

function call(url, method, body) {
  var opt = { method: method, credentials: "same-origin", headers: {} };
  if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  return fetch(url, opt).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, json: j }; });
  });
}
function showLock(msg) {
  $("#app").hidden = true;
  $("#lock").hidden = false;
  $("#lockmsg").textContent = msg || "";
}
function copyText(text, btn) {
  var done = function () {
    var old = btn.getAttribute("data-label") || btn.textContent;
    btn.setAttribute("data-label", old);
    btn.textContent = "Copied";
    setTimeout(function () { btn.textContent = old; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}
function fallbackCopy(text) {
  var t = document.createElement("textarea");
  t.value = text;
  t.setAttribute("readonly", "");
  t.style.position = "fixed";
  t.style.opacity = "0";
  document.body.appendChild(t);
  t.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(t);
}
// Body text with triple-backtick blocks shown as code, each with its own Copy button.
function renderBody(text, box) {
  var parts = String(text || "").split("```");
  parts.forEach(function (seg, i) {
    if (i % 2 === 0) {
      var t = seg.replace(/^\n+|\n+$/g, "");
      if (t) box.appendChild(el("div", "text", t));
    } else {
      var code = seg.replace(/^[^\n]*\n/, "").replace(/\n+$/, "");
      var wrap = el("div", "code");
      wrap.appendChild(el("pre", null, code));
      var b = el("button", "btn small ghost", "Copy");
      b.type = "button";
      b.addEventListener("click", function () { copyText(code, b); });
      wrap.appendChild(b);
      box.appendChild(wrap);
    }
  });
}
function oneLabel(section) {
  var t = TABS.filter(function (x) { return x.id === section; })[0];
  return t ? t.one : section;
}
function readCard(it, showSection) {
  var d = el("details", "card");
  var sum = el("summary");
  var chips = el("div", "chips");
  chips.appendChild(el("span", "chip", showSection ? oneLabel(it.section) : it.tag));
  if (it.status) chips.appendChild(el("span", it.status === "processed" ? "chip done" : "chip", it.status));
  sum.appendChild(chips);
  sum.appendChild(el("h2", null, it.title));
  if (showSection && it.topic) sum.appendChild(el("p", "meta", it.topic));
  d.appendChild(sum);
  var box = el("div");
  // Only real web links become clickable.
  if (typeof it.source === "string" && /^https:\/\//i.test(it.source)) {
    var line = el("p", "srcline");
    var a = el("a", null, "Open the source");
    a.href = it.source;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    line.appendChild(a);
    box.appendChild(line);
  }
  renderBody(it.body, box);
  var acts = el("div", "chips");
  acts.style.marginTop = "14px";
  var copy = el("button", "btn small ghost", "Copy text");
  copy.type = "button";
  copy.addEventListener("click", function () { copyText(it.body, copy); });
  acts.appendChild(copy);
  box.appendChild(acts);
  d.appendChild(box);
  return d;
}
// One card for a whole topic (a mentor); its parts open inside it.
function groupCard(topic, parts) {
  var d = el("details", "card");
  var sum = el("summary");
  var chips = el("div", "chips");
  chips.appendChild(el("span", "chip", parts[0].tag));
  sum.appendChild(chips);
  sum.appendChild(el("h2", null, topic));
  sum.appendChild(el("p", "meta", parts.length + (parts.length === 1 ? " part" : " parts")));
  d.appendChild(sum);
  var inner = el("div", "parts");
  parts.forEach(function (p) { inner.appendChild(readCard(p, false)); });
  d.appendChild(inner);
  return d;
}
function renderTabs() {
  var box = $("#tabs");
  box.textContent = "";
  box.className = query ? "tabs dim" : "tabs";
  TABS.forEach(function (t) {
    var b = el("button", "tab", t.label);
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", t.id === tab ? "true" : "false");
    b.addEventListener("click", function () { tab = t.id; $("#q").value = ""; query = ""; render(); });
    box.appendChild(b);
  });
}
function matches(it, q) {
  return [it.title, it.body, it.tag, it.topic, it.status].join(" ").toLowerCase().indexOf(q) >= 0;
}
function render() {
  renderTabs();
  var list = $("#list");
  list.textContent = "";
  var note = $("#searchnote");
  if (query) {
    var hits = items.filter(function (it) { return matches(it, query); });
    note.hidden = false;
    note.textContent = hits.length + (hits.length === 1 ? " result" : " results") + " across all tabs";
    if (!hits.length) { list.appendChild(el("p", "empty", "Nothing matches that search.")); return; }
    hits.forEach(function (it) { list.appendChild(readCard(it, true)); });
    return;
  }
  note.hidden = true;
  var rows = items.filter(function (it) { return it.section === tab; });
  if (!rows.length) {
    list.appendChild(el("p", "empty", EMPTY[tab] || "Nothing here yet."));
    return;
  }
  // Items that share a topic (for notes, the mentor) are grouped under one card, in order of first appearance.
  var out = [], groups = {};
  rows.forEach(function (it) {
    if (tab !== "notes" || !it.topic) { out.push({ one: it }); return; }
    if (!groups[it.topic]) { groups[it.topic] = { topic: it.topic, parts: [] }; out.push({ group: groups[it.topic] }); }
    groups[it.topic].parts.push(it);
  });
  out.forEach(function (o) { list.appendChild(o.group ? groupCard(o.group.topic, o.group.parts) : readCard(o.one, false)); });
}
function load() {
  return call("/api/knowledge", "GET").then(function (r) {
    if (r.status === 401) { showLock(); return; }
    if (r.status === 403) { showLock("This account does not have access to this tool."); return; }
    if (r.status === 503) { showLock("Backstage is not set up yet. Add BANK_PASSCODE in Vercel."); return; }
    if (!r.ok) { showLock("Could not load. Check your connection and try again."); return; }
    items = r.json.items || [];
    $("#lock").hidden = true;
    $("#app").hidden = false;
    render();
  }, function () { showLock("No connection. Try again."); });
}
$("#q").addEventListener("input", function () { query = this.value.trim().toLowerCase(); render(); });
$("#lockform").addEventListener("submit", function (e) {
  e.preventDefault();
  var pc = $("#pc").value;
  if (!pc) return;
  var btn = $("#lockbtn");
  btn.disabled = true;
  call("/api/auth", "POST", { action: "login", passcode: pc }).then(function (r) {
    btn.disabled = false;
    if (r.ok) { $("#pc").value = ""; $("#lockmsg").textContent = ""; load(); }
    else if (r.status === 429) showLock("Too many wrong tries. Try again in an hour.");
    else if (r.status === 401) showLock("That is not the passcode." + (typeof r.json.left === "number" ? " " + r.json.left + " tries left." : ""));
    else if (r.status === 503) showLock("Backstage is not set up yet. Add BANK_PASSCODE in Vercel.");
    else showLock("Something went wrong. Try again.");
  }, function () { btn.disabled = false; showLock("No connection. Try again."); });
});
$("#logout").addEventListener("click", function () {
  call("/api/auth", "POST", { action: "logout" }).then(function () { items = []; showLock(); });
});
load();
</script>
</body>
</html>

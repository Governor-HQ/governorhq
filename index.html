<style>
  :root {
    --bg: #0c0c0e; --bg-2: #17171a; --ink: #ece7dc; --ink-dim: #a9a79c;
    --hair: rgba(236, 231, 220, 0.14); --accent: #c99a4a; --accent-soft: rgba(201, 154, 74, 0.14);
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4efe4; --bg-2: #ece5d5; --ink: #201d17; --ink-dim: #6b6558;
      --hair: rgba(32, 29, 23, 0.14); --accent: #a8752c; --accent-soft: rgba(168, 117, 44, 0.12);
    }
  }
  :root[data-theme="light"] {
    --bg: #f4efe4; --bg-2: #ece5d5; --ink: #201d17; --ink-dim: #6b6558;
    --hair: rgba(32, 29, 23, 0.14); --accent: #a8752c; --accent-soft: rgba(168, 117, 44, 0.12);
  }
  :root[data-theme="dark"] {
    --bg: #0c0c0e; --bg-2: #17171a; --ink: #ece7dc; --ink-dim: #a9a79c;
    --hair: rgba(236, 231, 220, 0.14); --accent: #c99a4a; --accent-soft: rgba(201, 154, 74, 0.14);
  }

  * { box-sizing: border-box; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    min-height: 100%;
    background: radial-gradient(120% 90% at 50% -10%, var(--bg-2) 0%, var(--bg) 55%);
    color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: calc(3rem + env(safe-area-inset-top, 0px)) 1.5rem calc(3rem + env(safe-area-inset-bottom, 0px));
  }
  ::selection { background: var(--accent-soft); color: var(--ink); }

  .card { width: 100%; max-width: 420px; text-align: center; opacity: 0; animation: rise 1s var(--ease) forwards 0.15s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none !important; opacity: 1; } }

  .avatar { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; border: 1px solid var(--hair); margin: 0 auto 1.1rem; display: block; }
  .word { font-family: var(--serif); font-weight: 600; font-size: 1.5rem; color: var(--ink); margin: 0 0 0.5rem; }
  .tagline { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 1.05rem; color: var(--accent); margin: 0 0 2.4rem; }

  .links { display: flex; flex-direction: column; gap: 0.7rem; }

  .link-row {
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    padding: 0.95rem 1.25rem; border-radius: 8px; font-size: 0.98rem; text-decoration: none;
    font-family: var(--sans);
  }

  .link-row.primary {
    background: var(--accent); color: var(--bg); font-weight: 600;
    border: 1px solid var(--accent); position: relative; overflow: hidden;
    transition: transform 0.5s var(--ease), box-shadow 0.5s var(--ease);
  }
  .link-row.primary::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 60%;
    transform: translateX(-130%) skewX(-20deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
  }
  .link-row.primary:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -14px var(--accent); }
  .link-row.primary:hover::after { transform: translateX(260%) skewX(-20deg); transition: transform 1.1s var(--ease); }
  .link-row.primary svg { width: 16px; height: 16px; transition: transform 0.4s var(--ease); }
  .link-row.primary:hover svg { transform: translateX(3px); }
  @media (prefers-reduced-motion: reduce) { .link-row.primary::after { display: none; } }

  .link-row.secondary {
    background: transparent; color: var(--ink); font-weight: 500;
    border: 1px solid var(--hair); transition: border-color 0.4s ease, transform 0.5s var(--ease);
  }
  .link-row.secondary:hover { border-color: var(--accent); transform: translateY(-2px); }

  .link-row.disabled {
    background: transparent; color: var(--ink-dim); font-weight: 500;
    border: 1px solid var(--hair); cursor: not-allowed; user-select: none;
  }
  .badge {
    font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink-dim); background: var(--bg-2); border: 1px solid var(--hair);
    border-radius: 20px; padding: 0.2rem 0.55rem; margin-left: 0.35rem;
  }

  footer { margin-top: 2.6rem; font-size: 0.78rem; color: var(--ink-dim); opacity: 0.75; }
  footer a { color: inherit; text-decoration: underline; }
</style>
